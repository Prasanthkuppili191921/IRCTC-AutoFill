
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IRCTC AutoFill</title>

    <link rel="stylesheet" href="common/toast.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="header">
        <div class="logo" aria-hidden="true">IR</div>

        <div class="header-content">
            <h1>IRCTC AutoFill</h1>
            <p>Manage your saved booking records</p>
        </div>

        <button id="fillNewForm"
                class="add-record-button"
                type="button"
                aria-label="Create new booking record"
                title="Create new record">
            <span aria-hidden="true">+</span>
        </button>
    </header>

    <section aria-labelledby="recordsHeading">
        <div class="section-header">
            <h2 id="recordsHeading">Saved Records</h2>
            <span id="recordCount">0 records</span>
        </div>

        <div id="records" aria-live="polite">
            <div class="empty-state">
                <div class="empty-icon" aria-hidden="true">▤</div>
                <h3>No saved records yet</h3>
                <p>Create your first record using the + button above.</p>
            </div>
        </div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <script src="common/toast.js"></script>
    <script src="popup.js"></script>
</body>
</html>
