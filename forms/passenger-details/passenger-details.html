
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details</title>
    <link rel="stylesheet" href="passenger-details.css">
</head>
<body>
    <main class="passenger-container">
        <form id="passengerDetailsForm" novalidate>
            <section class="form-section">
                <div class="passenger-heading">
                    <h2>Passenger Details</h2>
                    <p>Enter passenger information and contact details for your journey.</p>
                </div>

                <div id="passengerList"></div>

                <button type="button"
                        id="addPassengerBtn"
                        class="secondary-btn">
                    + Add Passenger
                </button>
            </section>

            <section class="form-section contact-section">
                <h2>Contact Details</h2>

                <div class="field">
                    <label for="mobileNumber">Mobile Number</label>

                    <div class="phone-input">
                        <input type="text"
                               class="country-code"
                               value="91"
                               readonly
                               aria-label="Country code">

                        <input type="tel"
                               id="mobileNumber"
                               name="mobileNumber"
                               inputmode="numeric"
                               maxlength="10"
                               pattern="[0-9]{10}"
                               placeholder="10-digit mobile number"
                               autocomplete="tel-national">
                    </div>
                </div>
            </section>

            <p id="formMessage" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="passenger-details.js"></script>
</body>
</html>
