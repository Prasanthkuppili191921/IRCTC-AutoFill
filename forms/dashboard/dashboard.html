
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCTC AutoFill Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../../common/toast.css">
    <link rel="stylesheet" href="../record-storage/record-storage.css">
</head>
<body>
    <main class="dashboard-container">

        <div class="dashboard-toolbar">
            <button type="button" id="loadJsonButton">Load</button>
        </div>

        <section class="dashboard-section login-section">
            <iframe id="loginFrame"
                    src="../login/login.html"
                    title="Login Details">
            </iframe>
        </section>

        <section class="dashboard-section booking-section">
            <iframe id="bookingFrame"
                    src="../booking/booking.html?embedded=1"
                    title="Journey Details">
            </iframe>
        </section>

        <section class="dashboard-section train-selection-section">
            <iframe id="trainSelectionFrame"
                    src="../train-selection/train-selection.html?embedded=1"
                    title="Train Selection">
            </iframe>
        </section>

        <button type="button" id="saveDetailsButton">
            Save Details
        </button>

        <p id="dashboardStatus" role="status" aria-live="polite"></p>

    </main>

    <script src="../../common/toast.js"></script>
    <script src="../record-storage/record-storage.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
